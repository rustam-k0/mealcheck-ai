services:
  - type: web
    name: banana-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://opencode.ai/zen/go/v1
      - key: AI_PROVIDER
        value: opencode-go
      - key: AI_VISION_MODEL
        value: mimo-v2.5
      - key: AI_TEXT_MODEL
        value: mimo-v2.5-pro
      - key: AI_TRANSCRIPTION_MODEL
        value: mimo-v2.5
      - key: AI_MODEL_CATALOG
        value: mimo-v2.5|text+image+audio,mimo-v2.5-pro|text
      - key: ALLOWED_USERS
        sync: false
      - key: ADMIN_USERS
        sync: false
